version: '3.8'
services:
  backend:
    build: ./
    ports:
      - "8012:8012"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=8012
      - NODE_ENV=production
      - BUNNY_CDN_STORAGE_ZONE=${BUNNY_CDN_STORAGE_ZONE}
      - BUNNY_CDN_API_KEY=${BUNNY_CDN_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    restart: always